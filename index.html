<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ServePrint
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <section class="upload-section">

            <h1>
                Upload Your Document
            </h1>

            <p>
                Select a document to calculate
                your printing price.
            </p>


            <label
                for="printFile"
                class="upload-box"
            >

                <input
                    type="file"
                    id="printFile"
                    hidden
                    accept="
                        .pdf,
                        .jpg,
                        .jpeg,
                        .png,
                        .gif,
                        .webp,
                        .bmp,
                        .tif,
                        .tiff,
                        .heic,
                        .heif,
                        .docx,
                        .pptx,
                        .xlsx,
                        .txt
                    "
                >


                <div
                    id="uploadIcon"
                    class="upload-icon"
                >
                    📂
                </div>


                <div
                    id="uploadTitle"
                    class="upload-title"
                >
                    Click to Upload
                </div>


                <div
                    id="uploadText"
                    class="upload-text"
                >
                    Select your document
                </div>

            </label>


            <div
                id="fileName"
                class="file-name"
            >
                No File Selected
            </div>


            <div class="order-details">

                <div class="detail">

                    <span>
                        Pages
                    </span>

                    <strong id="pageCount">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Copies
                    </span>

                    <input
                        id="copies"
                        type="number"
                        min="1"
                        value="1"
                    >

                </div>


                <div class="detail">

                    <span>
                        Paper
                    </span>

                    <select id="paperSize">

                        <option value="A4">
                            A4
                        </option>

                        <option value="A3">
                            A3
                        </option>

                    </select>

                </div>


                <div class="detail">

                    <span>
                        Orientation
                    </span>

                    <select id="orientation">

                        <option value="Portrait">
                            Portrait
                        </option>

                        <option value="Landscape">
                            Landscape
                        </option>

                    </select>

                </div>

            </div>


            <div class="print-type">

                <label>

                    <input
                        type="radio"
                        name="printType"
                        value="bw"
                        checked
                    >

                    Black & White

                </label>


                <label>

                    <input
                        type="radio"
                        name="printType"
                        value="color"
                    >

                    Colour

                </label>

            </div>


            <div class="page-range">

                <label
                    for="pageRange"
                >
                    Page Range
                </label>

                <input
                    id="pageRange"
                    type="text"
                    placeholder="All"
                    value="All"
                >

            </div>


            <div class="summary">

                <div>

                    <span>
                        Print Type
                    </span>

                    <strong id="printSummary">
                        Black & White
                    </strong>

                </div>


                <div>

                    <span>
                        Paper Size
                    </span>

                    <strong id="paperSummary">
                        A4
                    </strong>

                </div>


                <div>

                    <span>
                        Queue
                    </span>

                    <strong id="queueCount">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Estimated Wait
                    </span>

                    <strong id="waitingTime">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Total
                    </span>

                    <strong>
                        ₹<span id="price">0</span>
                    </strong>

                </div>

            </div>


            <button
                id="payBtn"
                disabled
            >
                Proceed to Payment
            </button>


            <div
                id="status"
                class="status"
            >
                Waiting for Payment
            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
